name: Football Talent Exchange

on:
  push:
    paths: ["football-talent-exchange/**", ".github/workflows/football-talent-exchange.yml"]
  pull_request:
    paths: ["football-talent-exchange/**", ".github/workflows/football-talent-exchange.yml"]

defaults:
  run:
    working-directory: football-talent-exchange

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fte
          POSTGRES_PASSWORD: fte
          POSTGRES_DB: fte
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fte:fte@localhost:5432/fte
      AUTH_SECRET: ci-secret
      CRON_SECRET: ci-cron
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: football-talent-exchange/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: |
          npx next start &
          npx --yes wait-on@8.0.3 http://localhost:3000
          npx playwright test
